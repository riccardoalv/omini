[project]
name = "omini-devnet"
version = "0.1.0"
description = "Acme's simulated network: emulated device APIs for Omini's real integrations (development and tests)"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "cryptography>=42"]

[dependency-groups]
dev = ["pytest>=8", "ruff==0.16.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["emulator"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
