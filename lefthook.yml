# Git hooks. Install once with: make hooks
pre-commit:
  parallel: true
  jobs:
    - name: go-fmt
      glob: "*.go"
      run: golangci-lint fmt {staged_files}
      stage_fixed: true
    - name: go-lint
      glob: "*.go"
      run: golangci-lint run --fast-only ./...
    - name: python
      root: sdk/python/
      glob: "*.py"
      run: uv run ruff format {staged_files} && uv run ruff check --fix {staged_files}
      stage_fixed: true

    - name: web
      root: web/
      glob: "*.{ts,vue,css,json}"
      run: npx prettier --write {staged_files} && npx eslint --fix {staged_files}
      stage_fixed: true

commit-msg:
  jobs:
    - name: conventional-commit
      run: scripts/check-commit-msg.sh {1}
