<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="Omini: see your whole network, live, self-hosted">
  <!-- The repository's social preview (GitHub → Settings → Social preview).
       Name and mark sit in the middle: chat apps may crop it to a square. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#121a28"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.38" r="0.6">
      <stop offset="0" stop-color="#4c8dff" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#4c8dff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#30363d"/>
    </pattern>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#dots)" opacity="0.6"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <!-- Mark and name -->
  <g transform="translate(372 102) scale(5.5)">
    <circle cx="16" cy="16" r="11" stroke="#4c8dff" stroke-width="2" fill="none" opacity="0.45"/>
    <circle cx="16" cy="16" r="4" fill="#4c8dff"/>
    <circle cx="16" cy="5" r="2.6" fill="#4c8dff"/>
    <circle cx="25.5" cy="21.5" r="2.6" fill="#4c8dff"/>
    <circle cx="6.5" cy="21.5" r="2.6" fill="#4c8dff"/>
  </g>
  <text x="572" y="232" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="128" font-weight="700" fill="#e6edf3" letter-spacing="-3">Omini</text>

  <!-- Tagline -->
  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="640" y="330" font-size="40" font-weight="500" fill="#c9d1d9">See your whole network, live — self-hosted.</text>
    <text x="640" y="378" font-size="24" fill="#7d8590">Discovery · topology map · traffic · alerts · integrations</text>
  </g>

  <!-- A small map along the bottom -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#c9d1d9">
    <g stroke="#3b4a5f" stroke-width="2" fill="none">
      <path d="M302 520 H392"/>
      <path d="M498 520 H584"/>
      <path d="M702 520 H778"/>
      <path d="M740 520 V470 H778"/>
      <path d="M740 520 V570 H778"/>
      <path d="M900 520 H952"/>
    </g>
    <!-- WAN -->
    <rect x="226" y="499" width="76" height="42" rx="9" fill="#161b22" stroke="#4c8dff"/>
    <text x="246" y="525">WAN</text>
    <!-- Firewall and its traffic -->
    <rect x="392" y="496" width="106" height="48" rx="10" fill="#161b22" stroke="#30363d"/>
    <circle cx="413" cy="520" r="8" fill="#d94f3b"/>
    <text x="428" y="525">fw</text>
    <circle cx="486" cy="520" r="4" fill="#3fb950"/>
    <rect x="394" y="468" width="102" height="20" rx="10" fill="#0d1117" stroke="#30363d"/>
    <text x="403" y="483" font-size="12" fill="#3fb950">↓ 182 Mbps</text>
    <!-- Switch -->
    <rect x="584" y="499" width="118" height="42" rx="9" fill="#161b22" stroke="#30363d"/>
    <rect x="598" y="513" width="16" height="14" rx="2" fill="#4c8dff"/>
    <text x="624" y="525">switch</text>
    <!-- Server, AP and clients -->
    <rect x="778" y="451" width="122" height="38" rx="9" fill="#161b22" stroke="#30363d"/>
    <circle cx="796" cy="470" r="7" fill="#e57000"/>
    <text x="810" y="475">proxmox</text>
    <rect x="778" y="501" width="122" height="38" rx="9" fill="#161b22" stroke="#30363d"/>
    <text x="796" y="525">ap · 5G</text>
    <rect x="778" y="551" width="122" height="38" rx="9" fill="#161b22" stroke="#30363d"/>
    <circle cx="796" cy="570" r="7" fill="#a371f7"/>
    <text x="810" y="575">nas</text>
    <circle cx="962" cy="520" r="10" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <circle cx="994" cy="520" r="10" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <circle cx="1026" cy="520" r="10" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <path d="M972 520 H984 M1004 520 H1016" stroke="#3b4a5f" stroke-width="2"/>
  </g>
</svg>
