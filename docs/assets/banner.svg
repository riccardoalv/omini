<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Omini: a self-hosted map of your network">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#121a28"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#4c8dff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#4c8dff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#30363d"/>
    </pattern>
  </defs>
  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#dots)" opacity="0.6"/>
  <rect width="1280" height="400" fill="url(#glow)"/>

  <!-- Mark -->
  <g transform="translate(96 120) scale(5)">
    <circle cx="16" cy="16" r="11" stroke="#4c8dff" stroke-width="2" fill="none" opacity="0.45"/>
    <circle cx="16" cy="16" r="4" fill="#4c8dff"/>
    <circle cx="16" cy="5" r="2.6" fill="#4c8dff"/>
    <circle cx="25.5" cy="21.5" r="2.6" fill="#4c8dff"/>
    <circle cx="6.5" cy="21.5" r="2.6" fill="#4c8dff"/>
  </g>

  <!-- Name and tagline -->
  <text x="290" y="205" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="96" font-weight="700" fill="#e6edf3" letter-spacing="-2">Omini</text>
  <text x="294" y="252" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="28" fill="#9da7b3">See your whole network, live — self-hosted.</text>
  <text x="294" y="292" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#6e7681">Discovery · topology map · traffic · alerts · integrations</text>

  <!-- A small map -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#c9d1d9">
    <g stroke="#3b4a5f" stroke-width="2" fill="none">
      <path d="M906 200 H960"/>
      <path d="M1046 200 H1080 V110 H1112"/>
      <path d="M1080 200 H1112"/>
      <path d="M1080 200 V290 H1112"/>
      <path d="M1196 290 H1214"/>
    </g>
    <g stroke="#a371f7" stroke-width="2" stroke-dasharray="6 5" fill="none" opacity="0.7">
      <path d="M906 300 H1003 V222"/>
    </g>
    <!-- WAN -->
    <rect x="846" y="182" width="60" height="36" rx="8" fill="#161b22" stroke="#4c8dff"/>
    <text x="862" y="205">WAN</text>
    <!-- Firewall -->
    <rect x="960" y="178" width="86" height="44" rx="9" fill="#161b22" stroke="#30363d"/>
    <circle cx="977" cy="200" r="7" fill="#d94f3b"/>
    <text x="990" y="205">fw</text>
    <circle cx="1036" cy="200" r="3.5" fill="#3fb950"/>
    <!-- Area -->
    <rect x="1100" y="78" width="132" height="64" rx="10" fill="#4c8dff" fill-opacity="0.08" stroke="#4c8dff" stroke-opacity="0.6" stroke-dasharray="5 4"/>
    <text x="1104" y="72" fill="#9da7b3" font-size="11">SERVERS</text>
    <rect x="1112" y="92" width="108" height="36" rx="8" fill="#161b22" stroke="#30363d"/>
    <circle cx="1128" cy="110" r="6" fill="#e57000"/>
    <text x="1140" y="114">proxmox</text>
    <!-- Switch -->
    <rect x="1112" y="182" width="108" height="36" rx="8" fill="#161b22" stroke="#30363d"/>
    <rect x="1122" y="194" width="14" height="12" rx="2" fill="#4c8dff"/>
    <text x="1144" y="205">switch</text>
    <!-- AP + clients -->
    <rect x="1112" y="272" width="84" height="36" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="1124" y="295">ap · 5G</text>
    <circle cx="1222" cy="290" r="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <!-- Traffic badges -->
    <rect x="964" y="156" width="78" height="16" rx="8" fill="#0d1117" stroke="#30363d"/>
    <text x="970" y="168" font-size="10" fill="#3fb950">↓ 182 Mbps</text>
    <!-- Branch over VPN -->
    <rect x="846" y="284" width="60" height="32" rx="8" fill="#161b22" stroke="#a371f7"/>
    <text x="852" y="305" font-size="11">branch</text>
  </g>
</svg>
