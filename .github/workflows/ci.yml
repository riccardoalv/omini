name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (build, test, lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Build for Raspberry Pi (arm64, armv7)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build ./...
      - name: Test
        run: go test -race -covermode=atomic -coverpkg=./... -coverprofile=coverage.out ./...
      - name: Coverage summary
        run: |
          grep -v '_gen.go:' coverage.out > coverage.handwritten.out # skip generated code
          {
            echo "### Go test coverage"
            echo
            echo "| Package | Coverage |"
            echo "|---|---|"
            go test -cover ./... 2>/dev/null | awk -f scripts/coverage-table.awk
            echo
            echo "**Total (excluding generated code):** $(go tool cover -func=coverage.handwritten.out | awk '/^total:/ {print $3}')"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14

  generated:
    name: Generated code is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Regenerate from schema and diff
        run: make check-generated

  sdk:
    name: Python SDK (lint, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Test
        run: |
          uv run pytest --cov=omini_sdk --cov-report=term --cov-report=markdown-append:"$GITHUB_STEP_SUMMARY"
