[project]
name = "omini-sdk"
version = "0.1.0"
description = "SDK for writing Omini integration plugins"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.6"]

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omini_sdk"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["src/omini_sdk/models.py"] # generated from schema/
force-exclude = true # also when files are passed explicitly (git hooks)

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["omini_sdk"]
