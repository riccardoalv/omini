[project]
name = "omini-sdk"
version = "0.1.0"
description = "SDK for writing Omini integration plugins"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.6"]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=6", "ruff==0.16.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omini_sdk"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Generated from schema/ (make generate): formatted, but not linted.
"src/omini_sdk/models.py" = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["omini_sdk"]
