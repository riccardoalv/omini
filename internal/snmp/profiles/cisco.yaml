# Cisco IOS / IOS-XE (CISCO-PROCESS-MIB, CISCO-MEMORY-POOL-MIB, CISCO-ENVMON-MIB).
id: cisco
name: Cisco IOS
priority: 10
match:
  sys_object_id: [1.3.6.1.4.1.9.1]
vendor: Cisco
cpu_pct: { oid: 1.3.6.1.4.1.9.9.109.1.1.1.1.8, walk: avg } # cpmCPUTotal5minRev
mem_pct:
  used: { oid: 1.3.6.1.4.1.9.9.48.1.1.1.5.1 } # ciscoMemoryPoolUsed (processor)
  free: [{ oid: 1.3.6.1.4.1.9.9.48.1.1.1.6.1 }] # ciscoMemoryPoolFree
temperatures:
  - { sensor: Chassis (hottest), kind: board, oid: 1.3.6.1.4.1.9.9.13.1.3.1.3, walk: max } # ciscoEnvMonTemperatureStatusValue
# The MAC table is kept per VLAN: BRIDGE-MIB in community@vlan (v2c) or the v3
# context vlan-N, for each VLAN of vtpVlanState.
fdb_per_vlan: { vlans: 1.3.6.1.4.1.9.9.46.1.3.1.1.2, community: "{community}@{vlan}", context: "vlan-{vlan}" }
