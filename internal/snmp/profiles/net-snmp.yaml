# Net-SNMP agents (Linux, NAS, OpenWrt, EdgeOS, pfSense with net-snmp...):
# load, CPU, memory and swap from UCD-SNMP-MIB, sensors from LM-SENSORS-MIB.
id: net-snmp
name: Net-SNMP (UCD-SNMP-MIB)
priority: 0
match:
  oid_exists: [1.3.6.1.4.1.2021.4.5.0] # memTotalReal
cpu_pct: { oid: 1.3.6.1.4.1.2021.11.11.0, invert: true } # ssCpuIdle
mem_pct:
  total: { oid: 1.3.6.1.4.1.2021.4.5.0 } # memTotalReal
  free:
    - { oid: 1.3.6.1.4.1.2021.4.6.0 } # memAvailReal
    - { oid: 1.3.6.1.4.1.2021.4.14.0 } # memBuffer
    - { oid: 1.3.6.1.4.1.2021.4.15.0 } # memCached
swap_pct:
  total: { oid: 1.3.6.1.4.1.2021.4.3.0 } # memTotalSwap
  free: [{ oid: 1.3.6.1.4.1.2021.4.4.0 }] # memAvailSwap
load_avg:
  - { oid: 1.3.6.1.4.1.2021.10.1.3.1 } # laLoad.1
  - { oid: 1.3.6.1.4.1.2021.10.1.3.2 }
  - { oid: 1.3.6.1.4.1.2021.10.1.3.3 }
temperatures:
  - { sensor: Sensors (hottest), kind: board, oid: 1.3.6.1.4.1.2021.13.16.2.1.3, walk: max, scale: 0.001 } # lmTempSensorsValue, m°C
