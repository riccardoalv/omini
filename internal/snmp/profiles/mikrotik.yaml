# MikroTik RouterOS (MIKROTIK-MIB).
id: mikrotik
name: MikroTik RouterOS
priority: 10
match:
  sys_object_id: [1.3.6.1.4.1.14988]
vendor: MikroTik
role: router
model: { oid: 1.3.6.1.4.1.14988.1.1.7.8.0 } # mtxrBoardName
serial: { oid: 1.3.6.1.4.1.14988.1.1.7.3.0 } # mtxrSerialNumber
os_version: { oid: 1.3.6.1.4.1.14988.1.1.4.4.0 } # mtxrLicVersion (RouterOS version)
temperatures:
  - { sensor: CPU, kind: cpu, oid: 1.3.6.1.4.1.14988.1.1.3.11.0, scale: 0.1 } # mtxrHlProcessorTemperature
  - { sensor: Board, kind: board, oid: 1.3.6.1.4.1.14988.1.1.3.10.0, scale: 0.1 } # mtxrHlTemperature
firmware:
  current: { oid: 1.3.6.1.4.1.14988.1.1.7.4.0 } # mtxrFirmwareVersion (RouterBOOT)
  latest: { oid: 1.3.6.1.4.1.14988.1.1.7.7.0 } # mtxrFirmwareUpgradeVersion
