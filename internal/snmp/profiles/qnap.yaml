# QNAP QTS (NAS-MIB): values come as text ("12 %", "45 C/113 F", "3.8 GB").
id: qnap
name: QNAP QTS
priority: 20
match:
  oid_exists: [1.3.6.1.4.1.24681.1.2.1.0] # systemCPU-Usage
vendor: QNAP
role: server
cpu_pct: { oid: 1.3.6.1.4.1.24681.1.2.1.0 } # systemCPU-Usage
mem_pct:
  total: { oid: 1.3.6.1.4.1.24681.1.2.2.0 } # systemTotalMem
  free: [{ oid: 1.3.6.1.4.1.24681.1.2.3.0 }] # systemFreeMem
temperatures:
  - { sensor: CPU, kind: cpu, oid: 1.3.6.1.4.1.24681.1.2.5.0 } # cpu-Temperature
  - { sensor: System, kind: board, oid: 1.3.6.1.4.1.24681.1.2.6.0 } # systemTemperature
