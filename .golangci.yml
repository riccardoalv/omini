version: "2"

run:
  timeout: 5m

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - misspell
    - nolintlint
    - unconvert
    - usestdlibvars
  exclusions:
    generated: lax # skips files with a "Code generated ... DO NOT EDIT." header
    presets:
      - common-false-positives
      - std-error-handling

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/riccardoalv/omini
  exclusions:
    generated: lax
